# Only needed for TRANSPORT=agntcy / DISCOVERY=agntcy. TRANSPORT=local needs no Docker.
# Trimmed from agntcy/app-sdk services/docker (nats, clickhouse, otel, grafana removed).
services:
  slim:
    image: ghcr.io/agntcy/slim:1.0.0
    container_name: slim-dataplane
    ports:
      - "46357:46357"
    environment:
      - PASSWORD=${SLIM_GATEWAY_PASSWORD:-dummy_password}
      - CONFIG_PATH=/config.yaml
    volumes:
      - ./configs/slim/server-config.yaml:/config.yaml
    command: ["/slim", "--config", "/config.yaml"]
    networks:
      - gateway

  dir-api-server:
    image: ghcr.io/agntcy/dir-apiserver:v1.0.0-rc.3
    container_name: dir-api-server
    env_file:
      - ./configs/dir/apiserver.env
    ports:
      - 8888:8888
      - 8889:8889
    depends_on:
      - zot
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8889/healthz/ready || exit 1
      interval: 10s
      retries: 60
      start_period: 10s

  zot:
    image: ghcr.io/project-zot/zot:v2.1.14
    ports:
      - 5555:5000
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: curl -f http://localhost:5000/v2/ || exit 1
      interval: 5s
      retries: 60
      start_period: 15s

networks:
  gateway:
    driver: bridge
