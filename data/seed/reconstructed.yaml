# Reconstructed listings, written by the team at pattern level after published research (Kent 2021 eBay
# netsuke study; Oryx EU online-trade study): a legal material is named, the price is far above what that
# material sells for, and a photo shows the back or underside. Read only by scripts/build_dataset.py.
#
# price_ratio = multiple of the median real price for the same stated material + item type.
# photos: "met:<objectID>_<n>" (data/raw/met, CC0) or "museum:<objectID>" (data/museum, CC0).
# material / type are what textparse must read from the text; the build fails if they differ.

